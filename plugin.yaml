name: hermetic
version: "1.1.1"
requires_hermes: ">=0.21.5"
description: "Backend half of the Hermetic desktop plugin: spend and provider routing records, routing middleware, empty-reply debugging, and the AAI routes (skill history, ratings, tests, replays, judge) under /api/plugins/hermetic/."
author: "forefy"
provides_hooks:
  - post_api_request
  - api_request_error
  - transform_llm_output
provides_middleware:
  - llm_request
  - llm_execution
