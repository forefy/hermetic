name: hermetic
version: "1.3.0"
requires_hermes: ">=0.21.5"
description: "Backend half of the hermetic desktop plugin: spend and provider routing records, routing middleware, empty-reply debugging, the HDR guard (asks or blocks before the riskiest tool calls; off by default), and the AAI routes (skill history, ratings, tests, replays, judge) under /api/plugins/hermetic/."
author: "forefy"
provides_hooks:
  - post_api_request
  - api_request_error
  - transform_llm_output
  - pre_tool_call
provides_middleware:
  - llm_request
  - llm_execution
